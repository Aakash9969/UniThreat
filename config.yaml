# UniThreat configuration
# Every key here can be overridden; anything omitted falls back to defaults
# defined in src/config.py.

server:
  host: "127.0.0.1"      # bind address of the dashboard/API
  port: 8000

capture:
  backend: "live"       # live | replay
  autostart: true        # start capturing as soon as the server starts
  interface: "Wi-Fi"     # NIC name (null = Scapy default). Example: "eth0"
  promiscuous: true
  # Base BPF filter applied to the raw capture (direction filters are applied
  # on top of this). Leave null to auto-build from `direction` settings.
  bpf_filter: null
  direction: "outbound"  # outbound | inbound | any
  # For "outbound": only traffic ORIGINATING from these networks is analysed
  # (what leaves the protected enclave through the diode). IMPORTANT: this
  # must include the network you are actually on - roaming laptops change
  # subnets, and the dashboard warns you when the machine's own IP is
  # outside these ranges. Both campus subnets are listed below.
  trusted_cidrs: ["20.101.16.0/20", "10.202.64.0/20"]
  # For "inbound": only traffic DESTINED to these hosts is analysed
  # (what arrives on the receiving side of the diode).
  monitored_hosts: []    # e.g. ["192.168.20.5"]
  # Replay-mode settings (backend: replay)
  replay:
    pcap_path: null     # path to a .pcap file to analyse
    speed: 8.0           # replay speed multiplier. 8 = a 3-minute recording
                         # plays in ~25s, so flows close and alerts appear
                         # almost immediately (1.0 = real-time pacing)
    loop: true          # restart the file when it ends (continuous demo)

flow:
  idle_timeout_s: 30        # a flow is closed after this much silence
  active_timeout_s: 120      # ... or after being continuously active this long
  active_idle_threshold_s: 5 # gap > this = "idle" period (CICFlowMeter-compatible)
  max_concurrent_flows: 100000

detection:
  model_path: "models/latest_model.joblib"
  min_confidence: 0.55       # below this, a prediction is flagged low-confidence

alerts:
  dedup_window_s: 60         # same threat + same src/dst merges into one alert
  max_recent: 2000           # alerts kept in the in-memory ring
  persistence:
    enabled: true
    path: "data/alerts/alerts.db"   # SQLite history

training:
  test_size: 0.2
  random_state: 42
  n_estimators: 200
  use_xgboost: true
  max_samples_per_class: 0    # 0 = use the full dataset

dashboard:
  history_points: 120         # seconds of traffic shown in the live chart
